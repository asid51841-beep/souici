<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Heart Animation</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .heart {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .love_word {
            position: absolute;
            color: #ea80b0;
            font-size: 1rem;
            white-space: nowrap;
            text-shadow: 0 0 5px #fff;
            animation: move 5s infinite ease-in-out;
            opacity: 0.8;
        }

        @keyframes move {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(10px, -10px); }
        }
    </style>
</head>
<body>

    <div class="heart" id="heart"></div>

    <script>
        const heartContainer = document.getElementById('heart');
        const totalWords = 100; // عدد الكلمات

        for (let i = 0; i < totalWords; i++) {
            const word = document.createElement('div');
            word.className = 'love_word';
            word.innerText = 'I love you';
            
            // معادلة رسم القلب الرياضية
            const t = (i / totalWords) * 2 * Math.PI;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            
            word.style.left = `${x * 10 + 150}px`;
            word.style.top = `${y * 10 + 150}px`;
            word.style.animationDelay = `${i * 0.05}s`;
            
            heartContainer.appendChild(word);
        }
    </script>
</body>
</html>
